name: Validate Lua source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua parser
        run: python -m pip install luaparser==4.2.0
      - name: Parse all Lua files
        run: |
          python - <<'PY'
          from pathlib import Path
          from luaparser import ast
          files = sorted(Path('.').rglob('*.lua'))
          assert files, 'No Lua files found'
          for file in files:
              try:
                  ast.parse(file.read_text(encoding='utf-8'))
              except Exception as error:
                  raise SystemExit(f'Syntax error in {file}: {error}')
              print('OK', file)
          print(f'Validated {len(files)} Lua files')
          PY
      - name: Compile every script with real Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luau-tools"
          curl -fL --retry 3 --connect-timeout 15 \
            -o "$RUNNER_TEMP/luau-ubuntu.zip" \
            "https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip"
          unzip -q "$RUNNER_TEMP/luau-ubuntu.zip" -d "$RUNNER_TEMP/luau-tools"
          COMPILER="$(find "$RUNNER_TEMP/luau-tools" -type f -name luau-compile -print -quit)"
          test -n "$COMPILER"
          chmod +x "$COMPILER"
          while IFS= read -r -d '' file; do
            echo "Luau compile: $file"
            "$COMPILER" --null "$file" > /dev/null
          done < <(find . -name '*.lua' -type f -not -path './.git/*' -print0)
          echo "All Luau sources compiled successfully"

      - name: Verify small diagnostic loader delegates to core
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('Monarca.lua').read_text(encoding='utf-8')
          core = Path('hub_core.lua').read_text(encoding='utf-8')
          assert len(main.encode()) < 12000, 'Entrypoint should stay small'
          assert 'MonarcaBootstrap' in main and 'retry.Activated:Connect(launch)' in main
          assert 'hub_core.lua?v=' in main
          assert main.index('gui.Parent = parent') < main.index('game:HttpGet(repository')
          assert 'local ok, failure = xpcall(bootMonarca' in core
          assert core.strip().endswith('return ok, failure')
          assert 'hub_core.lua?v=0.8.6-' in main, 'Old core can be cached'
          for marker in (
              'end -- Player/Emote/666 block: release its many UI locals.',
              'end -- Settings + Visual block: release temporary UI registers.',
              'end -- drag-only locals',
              'local applyPlayer, playerAdjusted, paintFov, paintWalk, paintJump',
              'local disableAll, refresh',
          ):
              assert marker in core, f'Missing register-safe scope: {marker}'
          assert core.index('end -- Player/Emote/666 block:') < core.index(
              'end -- Settings + Visual block:')
          assert core.index('end -- Settings + Visual block:') < core.index(
              'local dragging, dragInput, dragStart, offsetStart')
          module = Path('modules/clone_invisibility.lua').read_text(encoding='utf-8')
          for marker in (
              'local function parkBody(realModel, root)',
              'local function restoreBody()',
              'cloneRoot.AssemblyLinearVelocity = initialVelocity',
              'if (root.Position - remotePivot.Position).Magnitude > MAX_PARK_DRIFT then',
              'function CloneInvisible:disable()',
              'return restoreWorldCharacter()',
          ):
              assert marker in module, f'Invisibility stabilization missing: {marker}'
          assert 'hum:Move(cloneHum.MoveDirection, false)' not in module
          assert 'hum.Jump = true' not in module
          assert '"Emote", "Anim", "666", "Settings"' in core, 'Anim tab missing'
          assert 'end -- Anim page: release temporary UI locals.' in core
          assert 'loadAuxiliary("anim_packs")' in core
          assert '"clone_invisibility", "anim_packs", "player_reverse"' in core
          assert 'Name = "AntiflingLabel"' in core and 'Name = "AntiflingToggle"' in core
          assert 'loadAuxiliary("antifling"):enable()' in core, 'Antifling toggle missing'
          assert '"radioactive_trail", "antifling", "emote_catalog", "server_invisibility"' in core, 'Anti-fling and emote cleanup missing'
          antifling = Path('modules/antifling.lua').read_text(encoding='utf-8')
          for marker in ('function Antifling:enable()', 'function Antifling:disable()',
                         'player.CharacterAdded:Connect(', 'Workspace.DescendantAdded:Connect(',
                         'Workspace.DescendantRemoving:Connect(', 'Workspace:GetPartBoundsInRadius(',
                         'part:IsDescendantOf(character)', 'restorePart(part)',
                         'not part.Anchored or isOtherCharacter(part)'):
              assert marker in antifling, f'Missing Antifling safeguard: {marker}'
          assert 'part.CanCollide = false' in antifling
          assert 'character.CanCollide = false' not in antifling
          assert 'part.AssemblyLinearVelocity =' not in antifling, 'Do not modify avatar velocity'
          assert 'and "FlingToggle" or "FlingConsentToggle"' in core
          assert 'addFlingControl("Fling"' in core
          assert 'addFlingControl("Aceitar Fling"' in core
          assert 'loadAuxiliary("fling_touch")' in core
          assert 'auxiliaryModules.fling_touch.shutdown' in core
          bounce = Path('modules/fling_touch.lua').read_text(encoding='utf-8')
          for feature in ('function Bounce:enable()', 'function Bounce:disable()',
                          'function Bounce:allowReceiving(desired)', 'function Bounce:shutdown()',
                          'remote:InvokeServer(action, desired)'):
              assert feature in bounce, f'Missing bounce client feature: {feature}'
          bounce_server = Path('server/MonarcaTouchBounce.server.lua').read_text(encoding='utf-8')
          for feature in ('otherState.receiving',
                          'state.sending', 'target:ApplyImpulse(impulse)',
                          'Players.PlayerRemoving:Connect(', 'remote.OnServerInvoke'):
              assert feature in bounce_server, f'Missing bounce server guard: {feature}'
          assert 'Humanoid:TakeDamage' not in bounce_server
          assert 'game.PrivateServerId' not in bounce_server, 'Public sessions must be supported'
          assert 'validSession' not in bounce_server, 'Old private-session gate remains'
          assert 'AssemblyLinearVelocity =' not in bounce_server
          assert 'Name = "EmoteSearch"' in core and 'Name = "EmoteSearchResults"' in core
          assert 'Name = "EmoteCatalogPicker"' in core
          assert 'Name = "EmotePlay"' in core and 'Name = "EmoteStop"' in core
          assert 'initializeCatalogUI()' in core
          assert 'loadAuxiliary("emote_catalog"):getCatalog()' in core
          assert 'loadAuxiliary("emote_catalog"):play(choice)' in core
          assert '"antifling", "emote_catalog", "server_invisibility"' in core
          catalog = Path('modules/emote_catalog.lua').read_text(encoding='utf-8')
          import re
          entries = re.findall(r'^    \{name = ".+?", id = "(\d+)", group = ".+?", aliases = ".+?"\},
          anim = Path('modules/anim_packs.lua').read_text(encoding='utf-8')
          import re
          expected = (
              'astronaut', 'bubbly', 'cartoony', 'elder', 'knight',
              'levitation', 'mage', 'ninja', 'oldschool', 'pirate',
              'robot', 'rthro', 'stylish', 'superhero', 'toy', 'vampire',
              'werewolf', 'zombie'
          )
          for name in expected:
              assert re.search(r'^    ' + name + r' = \{', anim, re.M), f'Missing R15 pack: {name}'
              assert ('id = "' + name + '", name = "') in core, f'Missing UI pack: {name}'
          assert anim.split('local SLOT_PATHS')[0].count('title = "') == len(expected), 'Wrong number of catalog entries'
          assert 'stopTracksUsing(animator, lastAppliedIds)' in anim, 'Restore must stop active tracks'
          assert 'function AnimPacks:enableMixed(basePreset, overrides)' in anim, 'Mixed R15 API missing'
          assert 'function AnimPacks:enable(presetName)' in anim, 'Complete pack API missing'
          assert 'function AnimPacks:getConfig()' in anim, 'Configuration readback missing'
          assert 'local chosen = overrides[PATH_TO_GROUP[path]] or base' in anim, 'Per-slot overrides missing'
          for movement in ('idle', 'walk', 'run', 'jump', 'fall', 'climb', 'swim', 'swimidle'):
              assert ('id = "' + movement + '", title = "') in anim, f'Missing animation state: {movement}'
              assert ('id = "' + movement + '", name = "') in core, f'Missing per-state UI: {movement}'
          assert 'paths = {"idle.Animation1", "idle.Animation2"}' in anim, 'Idle must set both clips'
          for marker in ('module:enableMixed(base, mixture)', 'APLICAR MISTURA', 'LIMPAR CAMPOS',
                         'Name = "AnimPicker_" .. movement.id', 'local resetOverrides = function() end'):
              assert marker in core, f'Missing mix picker feature: {marker}'
          assert 'restoreCurrent()\n    currentPreset = "default"' in anim
          for marker in ('Name = "AnimationSearch"', 'Name = "AnimationPackList"',
                         'local function filterChoices()', 'local requestPreset, requestLabel = selected, selectedLabel',
                         'end -- Anim page: release temporary UI locals.'):
              assert marker in core, f'Missing Anim search feature: {marker}'
          assert 'rbxassetid://' in anim and '1083473930' in anim
          print('Bootstrap, 18 R15 packs, mixed R15 slots, UI and restore scopes validated')
          PY
      - name: Verify local module files
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ('Monarca.lua', 'hub_core.lua', 'manifest.lua', 'modules/fullbright.lua',
                       'modules/lowgraphics.lua', 'modules/crosshair.lua',
                       'modules/player_fly.lua', 'modules/player_reverse.lua',
                       'modules/zombie_r6.lua',
                       'modules/pose_666.lua', 'modules/headless_local.lua',
                       'modules/korblox_right_leg.lua', 'modules/owner_tag.lua',
                       'modules/radioactive_trail.lua',
                       'modules/antifling.lua',
                       'modules/emote_catalog.lua',
                       'modules/fling_touch.lua',
                       'modules/server_invisibility.lua',
                       'modules/clone_invisibility.lua',
                       'modules/anim_packs.lua',
                       'server/MonarcaRigSwitch.server.lua',
                       'server/MonarcaInvisibility.server.lua',
                       'server/MonarcaTouchBounce.server.lua'):
              assert Path(path).is_file(), f'Missing {path}'
          print('All expected files present')
          PY
, catalog, re.M)
          assert len(entries) == 50, f'Expected 50 curated emotes, got {len(entries)}'
          assert len(set(entries)) == len(entries), 'Duplicate catalog emote ID'
          for feature in ('function Catalog:getCatalog()', 'function Catalog:play(item)',
                          'function Catalog:stop()', 'function Catalog:disable()',
                          'humanoid:GetAppliedDescription()', 'description:GetEmotes()',
                          'humanoid:PlayEmoteAsync(item.nativeName)',
                          'animator:LoadAnimation(animation)', 'Enum.HumanoidRigType.R15',
                          'characterConnection:Disconnect()'):
              assert feature in catalog, f'Missing emote behavior: {feature}'
          assert 'Instance.new("Animator")' not in catalog, 'Must use server-created Animator'
          assert 'function Catalog:play(item)' in catalog
          assert 'restoreButton:Activate()' not in core
          anim = Path('modules/anim_packs.lua').read_text(encoding='utf-8')
          import re
          expected = (
              'astronaut', 'bubbly', 'cartoony', 'elder', 'knight',
              'levitation', 'mage', 'ninja', 'oldschool', 'pirate',
              'robot', 'rthro', 'stylish', 'superhero', 'toy', 'vampire',
              'werewolf', 'zombie'
          )
          for name in expected:
              assert re.search(r'^    ' + name + r' = \{', anim, re.M), f'Missing R15 pack: {name}'
              assert ('id = "' + name + '", name = "') in core, f'Missing UI pack: {name}'
          assert anim.split('local SLOT_PATHS')[0].count('title = "') == len(expected), 'Wrong number of catalog entries'
          assert 'stopTracksUsing(animator, lastAppliedIds)' in anim, 'Restore must stop active tracks'
          assert 'function AnimPacks:enableMixed(basePreset, overrides)' in anim, 'Mixed R15 API missing'
          assert 'function AnimPacks:enable(presetName)' in anim, 'Complete pack API missing'
          assert 'function AnimPacks:getConfig()' in anim, 'Configuration readback missing'
          assert 'local chosen = overrides[PATH_TO_GROUP[path]] or base' in anim, 'Per-slot overrides missing'
          for movement in ('idle', 'walk', 'run', 'jump', 'fall', 'climb', 'swim', 'swimidle'):
              assert ('id = "' + movement + '", title = "') in anim, f'Missing animation state: {movement}'
              assert ('id = "' + movement + '", name = "') in core, f'Missing per-state UI: {movement}'
          assert 'paths = {"idle.Animation1", "idle.Animation2"}' in anim, 'Idle must set both clips'
          for marker in ('module:enableMixed(base, mixture)', 'APLICAR MISTURA', 'LIMPAR CAMPOS',
                         'Name = "AnimPicker_" .. movement.id', 'local resetOverrides = function() end'):
              assert marker in core, f'Missing mix picker feature: {marker}'
          assert 'restoreCurrent()\n    currentPreset = "default"' in anim
          for marker in ('Name = "AnimationSearch"', 'Name = "AnimationPackList"',
                         'local function filterChoices()', 'local requestPreset, requestLabel = selected, selectedLabel',
                         'end -- Anim page: release temporary UI locals.'):
              assert marker in core, f'Missing Anim search feature: {marker}'
          assert 'rbxassetid://' in anim and '1083473930' in anim
          print('Bootstrap, 18 R15 packs, mixed R15 slots, UI and restore scopes validated')
          PY
      - name: Verify local module files
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ('Monarca.lua', 'hub_core.lua', 'manifest.lua', 'modules/fullbright.lua',
                       'modules/lowgraphics.lua', 'modules/crosshair.lua',
                       'modules/player_fly.lua', 'modules/player_reverse.lua',
                       'modules/zombie_r6.lua',
                       'modules/pose_666.lua', 'modules/headless_local.lua',
                       'modules/korblox_right_leg.lua', 'modules/owner_tag.lua',
                       'modules/radioactive_trail.lua',
                       'modules/antifling.lua',
                       'modules/fling_touch.lua',
                       'modules/server_invisibility.lua',
                       'modules/clone_invisibility.lua',
                       'modules/anim_packs.lua',
                       'server/MonarcaRigSwitch.server.lua',
                       'server/MonarcaInvisibility.server.lua',
                       'server/MonarcaTouchBounce.server.lua'):
              assert Path(path).is_file(), f'Missing {path}'
          print('All expected files present')
          PY
