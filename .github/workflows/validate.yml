name: Validate Lua source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua parser
        run: python -m pip install luaparser==4.2.0
      - name: Parse all Lua files
        run: |
          python - <<'PY'
          from pathlib import Path
          from luaparser import ast
          files = sorted(Path('.').rglob('*.lua'))
          assert files, 'No Lua files found'
          for file in files:
              try:
                  ast.parse(file.read_text(encoding='utf-8'))
              except Exception as error:
                  raise SystemExit(f'Syntax error in {file}: {error}')
              print('OK', file)
          print(f'Validated {len(files)} Lua files')
          PY
      - name: Compile every script with real Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luau-tools"
          curl -fL --retry 3 --connect-timeout 15 \
            -o "$RUNNER_TEMP/luau-ubuntu.zip" \
            "https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip"
          unzip -q "$RUNNER_TEMP/luau-ubuntu.zip" -d "$RUNNER_TEMP/luau-tools"
          COMPILER="$(find "$RUNNER_TEMP/luau-tools" -type f -name luau-compile -print -quit)"
          test -n "$COMPILER"
          chmod +x "$COMPILER"
          while IFS= read -r -d '' file; do
            echo "Luau compile: $file"
            "$COMPILER" --null "$file" > /dev/null
          done < <(find . -name '*.lua' -type f -not -path './.git/*' -print0)
          echo "All Luau sources compiled successfully"

      - name: Verify local module files
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ('Monarca.lua', 'manifest.lua', 'modules/fullbright.lua',
                       'modules/lowgraphics.lua', 'modules/crosshair.lua',
                       'modules/player_fly.lua', 'modules/zombie_r6.lua',
                       'modules/pose_666.lua', 'modules/headless_local.lua',
                       'server/MonarcaRigSwitch.server.lua'):
              assert Path(path).is_file(), f'Missing {path}'
          print('All expected files present')
          PY
